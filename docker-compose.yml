services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finos
      POSTGRES_PASSWORD: finos
      POSTGRES_DB: finos
    ports:
      - "5432:5432"
    volumes:
      - finos-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://finos:finos@postgres:5432/finos?schema=public
      REDIS_URL: redis://redis:6379
      ENABLE_WORKERS: "true"
      JWT_ACCESS_SECRET: change-me-access
      JWT_REFRESH_SECRET: change-me-refresh
      WEB_ORIGIN: http://localhost:3000
      API_PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  finos-postgres:
